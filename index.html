<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>새 탭 - 서울디지털대학교 시작 페이지</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 바 -->
  <header class="top-bar">
    <div class="datetime-display" id="datetimeDisplay">
      <span id="currentDate"></span>
      <span class="divider">·</span>
      <span id="currentTime"></span>
    </div>
    <nav class="top-nav">
      <a href="https://mail.google.com" class="nav-link">Gmail</a>
      <a href="https://www.google.com/imghp" class="nav-link">이미지</a>
      <button id="themeToggle" class="icon-btn" title="다크 모드 전환" aria-label="다크 모드 전환">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
          <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
      </button>
    </nav>
  </header>

  <!-- 메인 컨텐츠 영역 -->
  <main class="main-container">
    <!-- 서울디지털대학교 공식 로고 (심볼/엠블럼 + 시그니처) -->
    <a href="https://www.sdu.ac.kr" target="_blank" rel="noopener noreferrer" class="logo-link" aria-label="서울디지털대학교 홈페이지 이동">
      <img src="sdu_logo.png" alt="SDU 서울디지털대학교 공식 로고" class="sdu-official-logo">
    </a>

    <!-- 구글 검색창 -->
    <form class="search-form" id="searchForm" action="https://www.google.com/search" method="GET">
      <div class="search-bar">
        <span class="search-icon" aria-hidden="true">
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#9aa0a6" d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"></path>
          </svg>
        </span>
        <input
          type="text"
          name="q"
          id="searchInput"
          class="search-input"
          placeholder="Google 검색 또는 URL 입력"
          autocomplete="off"
          autofocus
        >
        <button type="button" id="clearBtn" class="clear-btn" title="지우기" aria-label="검색어 지우기" hidden>
          <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="20" height="20">
            <path fill="#70757a" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path>
          </svg>
        </button>
      </div>

      <div class="search-buttons">
        <button type="submit" class="g-btn">Google 검색</button>
        <button type="button" id="luckyBtn" class="g-btn">I'm Feeling Lucky</button>
      </div>
    </form>

    <!-- 오늘의 날씨 위젯 (서울, 제주) -->
    <section class="weather-section" aria-label="오늘의 날씨">
      <div class="section-header">
        <h2 class="section-title">오늘의 날씨</h2>
        <button type="button" id="refreshWeatherBtn" class="text-icon-btn" title="날씨 새로고침">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span>업데이트</span>
        </button>
      </div>

      <div class="weather-grid">
        <!-- 서울 날씨 카드 -->
        <article class="weather-card" id="weather-seoul">
          <div class="weather-card-top">
            <div>
              <div class="city-badge">
                <span class="city-name">서울</span>
                <span class="city-sub">Seoul</span>
              </div>
              <p class="weather-desc" id="seoul-desc">날씨 불러오는 중...</p>
            </div>
            <div class="weather-icon-box" id="seoul-icon">⏳</div>
          </div>
          <div class="weather-card-bottom">
            <div class="temp-current" id="seoul-temp">--°</div>
            <div class="weather-meta">
              <span id="seoul-minmax">최고 --° / 최저 --°</span>
              <span id="seoul-detail">습도 --% · 바람 --m/s</span>
            </div>
          </div>
        </article>

        <!-- 제주 날씨 카드 -->
        <article class="weather-card" id="weather-jeju">
          <div class="weather-card-top">
            <div>
              <div class="city-badge">
                <span class="city-name">제주</span>
                <span class="city-sub">Jeju</span>
              </div>
              <p class="weather-desc" id="jeju-desc">날씨 불러오는 중...</p>
            </div>
            <div class="weather-icon-box" id="jeju-icon">⏳</div>
          </div>
          <div class="weather-card-bottom">
            <div class="temp-current" id="jeju-temp">--°</div>
            <div class="weather-meta">
              <span id="jeju-minmax">최고 --° / 최저 --°</span>
              <span id="jeju-detail">습도 --% · 바람 --m/s</span>
            </div>
          </div>
        </article>
      </div>
    </section>

    <!-- 오늘의 명언 위젯 -->
    <section class="quote-section" aria-label="오늘의 명언">
      <div class="quote-card">
        <div class="quote-badge">오늘의 명언</div>
        <blockquote class="quote-text" id="quoteText">
          "천리 길도 한 걸음부터 시작된다."
        </blockquote>
        <cite class="quote-author" id="quoteAuthor">— 노자</cite>
        <button type="button" id="newQuoteBtn" class="quote-refresh-btn" title="다른 명언 보기" aria-label="다른 명언 보기">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
          <span>다른 명언</span>
        </button>
      </div>
    </section>
  </main>

  <!-- 하단 푸터 (구글 스타일) -->
  <footer class="footer">
    <div class="footer-top">대한민국</div>
    <div class="footer-bottom">
      <div class="footer-links">
        <a href="https://about.google/">Google 정보</a>
        <a href="https://ads.google.com/">광고</a>
        <a href="https://www.google.com/services/">비즈니스</a>
      </div>
      <div class="footer-links">
        <span class="weather-source">날씨 데이터 제공: Open-Meteo</span>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
